name: Pilot installers
on: workflow_dispatch

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            config: '{}'
            artifact: linux-x64
            files: |
              **/bundle/deb/*.deb
              **/bundle/appimage/*.AppImage
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            config: '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
            artifact: macos-arm64
            files: '**/bundle/dmg/*.dmg'
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            config: '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
            artifact: macos-intel
            files: '**/bundle/dmg/*.dmg'
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            config: '{"bundle":{"windows":{"nsis":{"installMode":"currentUser"}}}}'
            artifact: windows-x64
            files: '**/bundle/nsis/*-setup.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Set up Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup default stable
      - run: npm ci
      - run: npm test
      - name: Build pilot packages
        shell: bash
        env:
          BUNDLE_CONFIG: ${{ matrix.config }}
        run: npm run tauri build -- --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --config "$BUNDLE_CONFIG" -- --locked
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Agentrance-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
